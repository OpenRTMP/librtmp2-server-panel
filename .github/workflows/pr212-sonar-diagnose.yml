name: PR212 Sonar diagnosis

on:
  push:
    branches:
      - chatgpt/fix-pr212-work

permissions:
  contents: write
  checks: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Capture SonarCloud annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp
          gh api "repos/${GITHUB_REPOSITORY}/check-runs/103835345600/annotations" --paginate > .tmp/pr212-sonar-annotations.json
          cat .tmp/pr212-sonar-annotations.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/pr212-sonar-annotations.json
          git commit -m "chore: capture PR212 Sonar annotations"
          git push
