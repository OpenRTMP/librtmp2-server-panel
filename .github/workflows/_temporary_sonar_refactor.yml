name: Temporary Sonar Refactor

on:
  push:
    branches:
      - security/fix-gunicorn-worker-guards

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply targeted refactor
        run: |
          echo '' | base64 -d > /tmp/refactor.py
          python /tmp/refactor.py
      - name: Verify syntax and regression tests
        run: |
          python -m py_compile config.py
          pytest -q tests/test_gunicorn_worker_regressions.py
      - name: Commit refactor
        run: |
          git config user.name "AlexanderWagnerDev"
          git config user.email "207699914+AlexanderWagnerDev@users.noreply.github.com"
          git add -A
          git commit -m "Refactor builtins alias collection complexity"
          git push origin HEAD:security/fix-gunicorn-worker-guards
