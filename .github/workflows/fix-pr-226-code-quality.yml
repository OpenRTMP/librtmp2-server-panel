name: Fix PR 226 code quality

on:
  push:
    branches:
      - security/fix-gunicorn-ast-bypasses-sep15

permissions:
  contents: write

jobs:
  fix-unused-variable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/fix-gunicorn-ast-bypasses-sep15

      - name: Remove unused dict_shadow_line assignment
        shell: python
        run: |
          from pathlib import Path

          path = Path("config.py")
          text = path.read_text(encoding="utf-8")
          marker = "def _call_expression_mutates_workers(expr, operator_bindings):"
          start = text.index(marker)
          end = text.index("\ndef _expression_mutates_workers", start)
          block = text[start:end]
          target = "    dict_shadow_line = operator_bindings[21] if len(operator_bindings) > 21 else None\n"
          if block.count(target) != 1:
              raise SystemExit(f"expected exactly one target assignment in helper, found {block.count(target)}")
          text = text[:start] + block.replace(target, "", 1) + text[end:]
          path.write_text(text, encoding="utf-8")

      - name: Commit fix
        run: |
          git diff --check
          git diff -- config.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.py
          git commit -m "fix: remove unused worker scan variable"
          git push origin HEAD:security/fix-gunicorn-ast-bypasses-sep15
