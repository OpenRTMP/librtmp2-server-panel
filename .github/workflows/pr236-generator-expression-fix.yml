name: PR 236 generator expression fix

on:
  push:
    branches:
      - cursor/application-security-review-6f28

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: detect consumed mutating generator expressions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Apply fix
        run: python .github/scripts/pr236_generator_fix.py

      - name: Compile config
        run: python -m py_compile config.py

      - name: Install test dependencies
        run: pip install --only-binary=:all: Flask==3.1.3 gunicorn==26.0.0 requests==2.34.2 Flask-WTF==1.3.0 'Flask-Limiter[redis]==4.1.1' pytest==9.1.1

      - name: Run non-integration tests
        env:
          SECRET_KEY: test-secret-key-for-ci-validation-only-32chars
          PASSWORD: test-password-for-ci-only
          LRTMP2_API_TOKEN: test-api-token-for-ci-only
        run: python -m pytest -q --tb=short -m 'not integration'

      - name: Commit fixes
        run: |
          git config user.name 'Alexander Wagner'
          git config user.email 'github@alexanderwagnerdev.com'
          git add config.py tests/test_gunicorn_indirect_workers_bypass.py
          git commit -m 'fix: detect consumed mutating generator expressions'
          git push
