name: Tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/fix-gunicorn-getattr-attrgetter-bypasses

      - name: Apply PR 191 Codex fixes
        if: "github.event_name == 'push' && github.event.head_commit.message == 'ci: fix PR 191 patch driver condition'"
        run: python .github/scripts/pr191_fix.py

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: "pip install --only-binary=:all: Flask==3.1.3 gunicorn==26.0.0 requests==2.34.2 Flask-WTF==1.3.0 'Flask-Limiter[redis]==4.1.1' pytest==9.1.1"

      - name: Validate config loading
        env:
          SECRET_KEY: test-secret-key-for-ci-validation-only-32chars
          PASSWORD: test-password-for-ci-only
          LRTMP2_API_TOKEN: test-api-token-for-ci-only
        run: python -c "from config import Config; print('Config OK')"

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci-validation-only-32chars
          PASSWORD: test-password-for-ci-only
          LRTMP2_API_TOKEN: test-api-token-for-ci-only
        run: python -m pytest -q --tb=short -m "not integration"

      - name: Validate frontend JavaScript
        run: node --check static/js/scripts.js

      - name: Commit PR 191 Codex fixes
        if: "github.event_name == 'push' && github.event.head_commit.message == 'ci: fix PR 191 patch driver condition'"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.py tests/test_gunicorn_indirect_workers_bypass.py
          git diff --cached --check
          git commit -m "Fix Codex Gunicorn scanner findings"
          git push origin HEAD:security/fix-gunicorn-getattr-attrgetter-bypasses
