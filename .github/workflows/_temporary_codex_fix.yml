name: Temporary Codex Fix

on:
  push:
    branches:
      - security/fix-gunicorn-worker-guards

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run targeted Codex patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("config.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new)

          replace_once(
          '''def _collect_builtins_import_aliases(statements):
              """Collect import-time names introduced by ``import builtins``."""
              aliases = set()
              for node in statements:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      continue
                  if isinstance(node, ast.Import):
                      for imported in node.names:
                          if imported.name == "builtins":
                              aliases.add(imported.asname or imported.name)
                  for block in _compound_statement_blocks(node):
                      aliases.update(_collect_builtins_import_aliases(block))
              return aliases


          def _collect_builtins_aliases(tree):''',
          '''def _collect_builtins_import_aliases(statements):
              """Collect import-time names introduced by ``import builtins``."""
              aliases = set()
              for node in statements:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      continue
                  if isinstance(node, ast.Import):
                      for imported in node.names:
                          if imported.name == "builtins":
                              aliases.add(imported.asname or imported.name)
                  for block in _compound_statement_blocks(node):
                      aliases.update(_collect_builtins_import_aliases(block))
              return aliases


          def _collect_builtins_exec_eval_aliases(statements):
              """Collect names imported directly from ``builtins`` as exec/eval aliases."""
              aliases = set()
              for node in statements:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      continue
                  if isinstance(node, ast.ImportFrom) and node.module == "builtins":
                      for imported in node.names:
                          if imported.name in _DYNAMIC_EXEC_EVAL_NAMES:
                              aliases.add(imported.asname or imported.name)
                  for block in _compound_statement_blocks(node):
                      aliases.update(_collect_builtins_exec_eval_aliases(block))
              return aliases


          def _collect_builtins_aliases(tree):''')

          replace_once(
          '''def _direct_name_is_builtin_exec_eval(func, call, shadow_lines):
              """Return True when a direct exec/eval name still resolves to the builtin."""
              if not isinstance(func, ast.Name) or func.id not in _DYNAMIC_EXEC_EVAL_NAMES:
                  return False
              shadow_line = shadow_lines.get(func.id)
              call_line = getattr(call, "lineno", 0)
              return shadow_line is None or not call_line or shadow_line > call_line


          def _call_is_dynamic_exec_eval(
              call,
              builtins_aliases=None,
              exec_eval_shadow_lines=None,
          ):
              """Return True for direct built-ins or known builtins-module calls."""
              if not isinstance(call, ast.Call):
                  return False
              if builtins_aliases is None:
                  builtins_aliases = set()
              if exec_eval_shadow_lines is None:
                  exec_eval_shadow_lines = {}
              func = call.func
              return (
                  _direct_name_is_builtin_exec_eval(func, call, exec_eval_shadow_lines)
                  or _getattr_is_dynamic_exec_eval(func, builtins_aliases)
                  or _subscript_is_dynamic_exec_eval(func, builtins_aliases)
                  or _attribute_is_dynamic_exec_eval(func, builtins_aliases)
              )''',
          '''def _direct_name_is_builtin_exec_eval(
              func,
              call,
              shadow_lines,
              direct_aliases=None,
          ):
              """Return True when a direct name resolves to builtin exec/eval."""
              if not isinstance(func, ast.Name):
                  return False
              if direct_aliases and func.id in direct_aliases:
                  return True
              if func.id not in _DYNAMIC_EXEC_EVAL_NAMES:
                  return False
              shadow_line = shadow_lines.get(func.id)
              call_line = getattr(call, "lineno", 0)
              return shadow_line is None or not call_line or shadow_line > call_line


          def _call_is_dynamic_exec_eval(
              call,
              builtins_aliases=None,
              exec_eval_shadow_lines=None,
              direct_aliases=None,
          ):
              """Return True for direct built-ins or known builtins-module calls."""
              if not isinstance(call, ast.Call):
                  return False
              if builtins_aliases is None:
                  builtins_aliases = set()
              if exec_eval_shadow_lines is None:
                  exec_eval_shadow_lines = {}
              if direct_aliases is None:
                  direct_aliases = set()
              func = call.func
              return (
                  _direct_name_is_builtin_exec_eval(
                      func,
                      call,
                      exec_eval_shadow_lines,
                      direct_aliases,
                  )
                  or _getattr_is_dynamic_exec_eval(func, builtins_aliases)
                  or _subscript_is_dynamic_exec_eval(func, builtins_aliases)
                  or _attribute_is_dynamic_exec_eval(func, builtins_aliases)
              )''')

          replace_once(
          '''    builtins_aliases = operator_bindings[8] if len(operator_bindings) > 8 else set()
              exec_eval_shadow_lines = operator_bindings[9] if len(operator_bindings) > 9 else {}
              if isinstance(expr, ast.Call) and (
                  _call_is_dynamic_exec_eval(
                      expr,
                      builtins_aliases,
                      exec_eval_shadow_lines,
                  )''',
          '''    builtins_aliases = operator_bindings[8] if len(operator_bindings) > 8 else set()
              exec_eval_shadow_lines = operator_bindings[9] if len(operator_bindings) > 9 else {}
              direct_exec_eval_aliases = (
                  operator_bindings[10] if len(operator_bindings) > 10 else set()
              )
              if isinstance(expr, ast.Call) and (
                  _call_is_dynamic_exec_eval(
                      expr,
                      builtins_aliases,
                      exec_eval_shadow_lines,
                      direct_exec_eval_aliases,
                  )''')

          replace_once(
          '''    builtins_aliases = _collect_builtins_aliases(tree)
              exec_eval_shadow_lines = _collect_definite_exec_eval_shadow_lines(tree)
              return (
                  module_aliases,
                  setitem_aliases,
                  namespace_aliases,
                  ior_aliases,
                  partial_aliases,
                  mutator_aliases,
                  methodcaller_aliases,
                  dict_update_aliases,
                  builtins_aliases,
                  exec_eval_shadow_lines,
              )''',
          '''    builtins_aliases = _collect_builtins_aliases(tree)
              exec_eval_shadow_lines = _collect_definite_exec_eval_shadow_lines(tree)
              direct_exec_eval_aliases = _collect_builtins_exec_eval_aliases(tree.body)
              return (
                  module_aliases,
                  setitem_aliases,
                  namespace_aliases,
                  ior_aliases,
                  partial_aliases,
                  mutator_aliases,
                  methodcaller_aliases,
                  dict_update_aliases,
                  builtins_aliases,
                  exec_eval_shadow_lines,
                  direct_exec_eval_aliases,
              )''')

          replace_once(
          '''def _default_gunicorn_config_paths() -> list[Path]:
              """Return the implicit config from Gunicorn's launch directory, if present."""
              for directory in _gunicorn_launch_directories():
                  try:
                      resolved = (directory / "gunicorn.conf.py").resolve()
                  except (OSError, RuntimeError):
                      continue
                  if resolved.is_file():
                      return [resolved]
              return []''',
          '''def _default_gunicorn_config_paths() -> list[Path]:
              """Return all plausible implicit Gunicorn configs from cwd/PWD."""
              paths = []
              for directory in _gunicorn_launch_directories():
                  try:
                      resolved = (directory / "gunicorn.conf.py").resolve()
                  except (OSError, RuntimeError):
                      continue
                  if resolved.is_file() and resolved not in paths:
                      paths.append(resolved)
              return paths''')

          replace_once(
          '''def _worker_count_from_environment() -> int:
              """Return the environment-provided default worker count."""
              count = 1
              for env_key in ("WEB_CONCURRENCY", "GUNICORN_WORKERS"):
                  raw = os.environ.get(env_key, "").strip()
                  if raw.isdigit():
                      count = int(raw)
              return count''',
          '''def _worker_count_from_environment() -> int:
              """Return the largest safety-relevant environment worker count."""
              counts = [1]
              for env_key in ("WEB_CONCURRENCY", "GUNICORN_WORKERS"):
                  raw = os.environ.get(env_key, "").strip()
                  if raw.isdigit():
                      counts.append(int(raw))
              return max(counts)''')

          replace_once(
          '''def _detect_worker_settings() -> tuple[int, bool]:''',
          '''def _apply_implicit_gunicorn_config_worker_details(
              count: int,
              config_paths: list[Path],
          ) -> tuple[int, bool, bool]:
              """Combine plausible implicit configs and fail closed on ambiguity."""
              candidates = []
              runtime_dynamic = False
              for path in config_paths:
                  configured_count, candidate_dynamic, candidate_runtime_dynamic = (
                      _gunicorn_config_worker_details_from_path(str(path))
                  )
                  effective_count = configured_count if configured_count is not None else count
                  candidates.append((effective_count, candidate_dynamic))
                  runtime_dynamic = runtime_dynamic or candidate_runtime_dynamic
              if not candidates:
                  return count, False, False
              assignment_dynamic = (
                  any(candidate_dynamic for _, candidate_dynamic in candidates)
                  or len(set(candidates)) > 1
              )
              safe_count = max(candidate_count for candidate_count, _ in candidates)
              return safe_count, assignment_dynamic, runtime_dynamic


          def _detect_worker_settings() -> tuple[int, bool]:''')

          replace_once(
          '''        if default_paths:
                      count, assignment_dynamic, runtime_dynamic = (
                          _apply_gunicorn_config_worker_details(count, str(default_paths[0]))
                      )''',
          '''        if default_paths:
                      count, assignment_dynamic, runtime_dynamic = (
                          _apply_implicit_gunicorn_config_worker_details(count, default_paths)
                      )''')

          path.write_text(text, encoding="utf-8")

          tests = Path("tests/test_gunicorn_worker_regressions.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "def test_environment_prefers_larger_safety_relevant_worker_count"
          if marker not in test_text:
              test_text += '''


def test_environment_prefers_larger_safety_relevant_worker_count(
              monkeypatch, tmp_path, config_module
          ):
              monkeypatch.chdir(tmp_path)
              monkeypatch.setenv("WEB_CONCURRENCY", "4")
              monkeypatch.setenv("GUNICORN_WORKERS", "1")
              monkeypatch.setattr(sys, "argv", ["gunicorn", "app:app"])

              assert config_module._detect_worker_settings() == (4, False)


          def test_direct_builtins_exec_alias_fails_closed(config_module):
              tree = ast.parse(
                  "workers = 1\\n"
                  "from builtins import exec as run\\n"
                  "run('workers = 4')\\n"
              )

              assert config_module._scan_gunicorn_config_workers(tree) == (1, True)


          def test_differing_cwd_and_pwd_configs_fail_closed(
              monkeypatch, tmp_path, config_module
          ):
              launch_dir = tmp_path / "launch"
              app_dir = tmp_path / "app"
              launch_dir.mkdir()
              app_dir.mkdir()
              (launch_dir / "gunicorn.conf.py").write_text(
                  f"chdir = {str(app_dir)!r}\\nworkers = 4\\n",
                  encoding="utf-8",
              )
              (app_dir / "gunicorn.conf.py").write_text(
                  "workers = 1\\n",
                  encoding="utf-8",
              )

              monkeypatch.setenv("PWD", str(launch_dir))
              monkeypatch.chdir(app_dir)
              monkeypatch.setattr(sys, "argv", ["gunicorn", "app:app"])

              assert config_module._detect_worker_settings() == (4, True)
          '''
          tests.write_text(test_text, encoding="utf-8")

          Path(".github/workflows/_temporary_codex_fix.yml").unlink()
          PY
      - name: Commit targeted fix
        run: |
          git config user.name "AlexanderWagnerDev"
          git config user.email "207699914+AlexanderWagnerDev@users.noreply.github.com"
          git add config.py tests/test_gunicorn_worker_regressions.py .github/workflows/_temporary_codex_fix.yml
          git commit -m "Fix latest Codex worker guard findings"
          git push origin HEAD:security/fix-gunicorn-worker-guards
