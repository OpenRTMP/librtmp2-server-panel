name: Apply PR 191 Sonar fix

on:
  push:
    branches:
      - security/fix-gunicorn-getattr-attrgetter-bypasses
    paths:
      - .github/workflows/pr191-sonar-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/fix-gunicorn-getattr-attrgetter-bypasses

      - name: Replace empty partial factory branch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("config.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          start = next(
              i for i, line in enumerate(lines)
              if line.startswith("def _partial_factory_call(")
          )
          end = next(
              i for i in range(start + 1, len(lines))
              if lines[i].startswith("def ")
          )

          elif_index = next(
              i for i in range(start, end)
              if lines[i].strip() == "elif ("
          )
          pass_index = next(
              i for i in range(elif_index, end)
              if lines[i].strip() == "pass"
          )
          else_index = pass_index + 1
          return_index = pass_index + 2

          if lines[else_index].strip() != "else:" or lines[return_index].strip() != "return None":
              raise SystemExit("Unexpected partial factory branch layout")

          newline = "\r\n" if lines[elif_index].endswith("\r\n") else "\n"
          lines[elif_index] = "    elif not (" + newline
          del lines[pass_index:else_index + 1]

          path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.py
          git diff --cached --check
          git commit -m "Fix Sonar empty block in partial factory scanner"
          git push origin HEAD:security/fix-gunicorn-getattr-attrgetter-bypasses
