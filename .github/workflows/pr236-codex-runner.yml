name: Run PR 236 Codex fixes

on:
  push:
    branches:
      - cursor/application-security-review-6f28

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.head_commit.message != 'fix: address PR 236 Codex findings'
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-secret-key-for-ci-validation-only-32chars
      PASSWORD: test-password-for-ci-only
      LRTMP2_API_TOKEN: test-api-token-for-ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        shell: bash
        run: |
          pip install --only-binary=:all: Flask==3.1.3 gunicorn==26.0.0 requests==2.34.2 Flask-WTF==1.3.0 'Flask-Limiter[redis]==4.1.1' pytest==9.1.1
      - name: Extract and apply patch
        shell: bash
        run: |
          awk '/^          python - <<'\''PY'\''$/{flag=1; next} /^          PY$/{flag=0} flag {sub(/^          /, ""); print}' .github/workflows/pr236-codex-fixes.yml > /tmp/pr236_fix.py
          awk '/^          cat >> tests\/test_gunicorn_indirect_workers_bypass.py <<'\''PYTEST'\''$/{flag=1; next} /^PYTEST$/{flag=0} flag {print}' .github/workflows/pr236-codex-fixes.yml > /tmp/pr236_tests.py
          python /tmp/pr236_fix.py
          cat /tmp/pr236_tests.py >> tests/test_gunicorn_indirect_workers_bypass.py
          python -m py_compile config.py
          python -m pytest -q --tb=short tests/test_gunicorn_indirect_workers_bypass.py
          python -m pytest -q --tb=short -m 'not integration'
      - name: Commit tested fixes
        shell: bash
        run: |
          git config user.name 'openrtmp-maintenance[bot]'
          git config user.email 'openrtmp-maintenance[bot]@users.noreply.github.com'
          git add config.py tests/test_gunicorn_indirect_workers_bypass.py
          git commit -m 'fix: address PR 236 Codex findings'
          git push
