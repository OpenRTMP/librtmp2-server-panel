name: PR 167 findings fix

on:
  push:
    branches:
      - cursor/application-security-review-5a20
    paths:
      - .github/workflows/pr167-findings-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/application-security-review-5a20

      - name: Apply review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path("config.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)
          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          replacements = {
              "_dict_literal_sets_workers": '''def _dict_literal_sets_workers(node):
              """Return True when a dict literal contains a ``workers`` key."""
              if not isinstance(node, ast.Dict):
                  return False
              return any(
                  isinstance(key, ast.Constant) and key.value == "workers"
                  for key in node.keys
              )


          def _is_current_module_reference(node):
              """Return True for expressions that resolve to this config module."""
              if not isinstance(node, ast.Subscript):
                  return False
              if not isinstance(node.slice, ast.Name) or node.slice.id != "__name__":
                  return False
              modules = node.value
              if not isinstance(modules, ast.Attribute) or modules.attr != "modules":
                  return False
              root = modules.value
              if isinstance(root, ast.Name) and root.id == "sys":
                  return True
              return (
                  isinstance(root, ast.Call)
                  and isinstance(root.func, ast.Name)
                  and root.func.id == "__import__"
                  and len(root.args) == 1
                  and isinstance(root.args[0], ast.Constant)
                  and root.args[0].value == "sys"
                  and not root.keywords
              )


          def _is_module_namespace_mapping(node, namespace_aliases=None):
              """Return True for mappings known to be the current module namespace."""
              if namespace_aliases is None:
                  namespace_aliases = set()
              if isinstance(node, ast.Name) and node.id in namespace_aliases:
                  return True
              if _is_globals_call(node):
                  return True
              if isinstance(node, ast.Attribute) and node.attr == "__dict__":
                  return _is_current_module_reference(node.value)
              if not isinstance(node, ast.Call) or not isinstance(node.func, ast.Name):
                  return False
              if node.func.id == "vars":
                  return (
                      len(node.args) == 1
                      and not node.keywords
                      and _is_current_module_reference(node.args[0])
                  )
              if node.func.id == "getattr":
                  return (
                      len(node.args) == 2
                      and not node.keywords
                      and _is_current_module_reference(node.args[0])
                      and isinstance(node.args[1], ast.Constant)
                      and node.args[1].value == "__dict__"
                  )
              return False
          ''',
              "_call_update_sets_workers": '''def _update_payload_may_set_workers(call):
              """Return True when an update payload may assign the ``workers`` key."""
              for arg in call.args:
                  if isinstance(arg, ast.Dict):
                      if _dict_literal_sets_workers(arg):
                          return True
                      continue
                  # Mapping/call/iterable payloads cannot be proven to omit workers.
                  return True
              for keyword in call.keywords:
                  if keyword.arg is None or keyword.arg == "workers":
                      return True
              return False


          def _call_is_module_namespace_workers_update(call, namespace_aliases=None):
              """Return True when module namespace ``update`` may change workers."""
              if not isinstance(call, ast.Call):
                  return False
              if not isinstance(call.func, ast.Attribute) or call.func.attr != "update":
                  return False
              if not _is_module_namespace_mapping(call.func.value, namespace_aliases):
                  return False
              return _update_payload_may_set_workers(call)
          ''',
              "_call_is_globals_workers_update": '''def _collect_module_namespace_aliases(tree):
              """Collect names that are always assigned a module namespace mapping."""
              assignments = {}

              def record(statements):
                  for node in statements:
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                          continue
                      if isinstance(node, ast.Assign):
                          for target in node.targets:
                              if isinstance(target, ast.Name):
                                  assignments.setdefault(target.id, []).append(node.value)
                      elif isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                          assignments.setdefault(node.target.id, []).append(node.value)
                      elif isinstance(node, ast.AugAssign) and isinstance(node.target, ast.Name):
                          assignments.setdefault(node.target.id, []).append(None)
                      for block in _compound_statement_blocks(node):
                          record(block)

              record(tree.body)
              aliases = set()
              changed = True
              while changed:
                  changed = False
                  for name, values in assignments.items():
                      if name in aliases or not values:
                          continue
                      if all(
                          value is not None
                          and _is_module_namespace_mapping(value, aliases)
                          for value in values
                      ):
                          aliases.add(name)
                          changed = True
              return aliases
          ''',
              "_call_is_operator_setitem_workers": '''def _call_is_operator_setitem_workers(call, operator_bindings):
              """Return True for imported ``operator.setitem(globals(), 'workers', ...)``."""
              if not isinstance(call, ast.Call) or len(call.args) < 2:
                  return False
              if not _is_globals_call(call.args[0]) or not _constant_is_workers(call.args[1]):
                  return False

              module_aliases, setitem_aliases = operator_bindings[:2]
              func = call.func
              if isinstance(func, ast.Attribute) and func.attr == "setitem":
                  return (
                      isinstance(func.value, ast.Name)
                      and func.value.id in module_aliases
                  )
              return isinstance(func, ast.Name) and func.id in setitem_aliases
          ''',
              "_expression_mutates_workers": '''def _expression_mutates_workers(expr, operator_bindings):
              """Return True when an evaluated expression mutates ``workers`` indirectly."""
              if isinstance(expr, ast.Lambda):
                  return False
              namespace_aliases = operator_bindings[2] if len(operator_bindings) > 2 else set()
              if isinstance(expr, ast.Call) and (
                  _call_is_module_namespace_workers_update(expr, namespace_aliases)
                  or _call_mutates_workers_via_indirection(expr, operator_bindings)
              ):
                  return True
              return any(
                  _expression_mutates_workers(child, operator_bindings)
                  for child in ast.iter_child_nodes(expr)
              )
          ''',
              "_is_dynamic_workers_mutation": '''def _is_dynamic_workers_mutation(node, operator_bindings):
              """Return True for import-time mutations the AST scan cannot treat as static."""
              if any(
                  isinstance(child, ast.expr)
                  and _expression_mutates_workers(child, operator_bindings)
                  for child in ast.iter_child_nodes(node)
              ):
                  return True

              if isinstance(node, ast.Expr) and isinstance(node.value, ast.Call):
                  call = node.value
                  if isinstance(call.func, ast.Name) and call.func.id in {"exec", "eval"}:
                      return True
                  if _call_mutates_workers_via_indirection(call, operator_bindings):
                      return True

              if isinstance(node, ast.Assign):
                  return any(_indirect_workers_assignment_target(target) for target in node.targets)

              if isinstance(node, (ast.AnnAssign, ast.AugAssign)):
                  return _indirect_workers_assignment_target(node.target)

              return False
          ''',
              "_collect_operator_setitem_bindings": '''def _collect_operator_setitem_bindings(tree):
              """Collect aliases used by operator and module-namespace mutation scans."""
              module_aliases = set()
              setitem_aliases = set()

              def visit(statements):
                  for node in statements:
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                          continue
                      if isinstance(node, ast.Import):
                          for alias in node.names:
                              if alias.name == "operator":
                                  module_aliases.add(alias.asname or alias.name)
                      elif isinstance(node, ast.ImportFrom) and node.module == "operator":
                          for alias in node.names:
                              if alias.name == "setitem":
                                  setitem_aliases.add(alias.asname or alias.name)
                      for block in _compound_statement_blocks(node):
                          visit(block)

              visit(tree.body)
              namespace_aliases = _collect_module_namespace_aliases(tree)
              return module_aliases, setitem_aliases, namespace_aliases
          ''',
          }

          lines = source.splitlines(keepends=True)
          for name, replacement in sorted(
              replacements.items(), key=lambda item: functions[item[0]].lineno, reverse=True
          ):
              node = functions[name]
              lines[node.lineno - 1 : node.end_lineno] = [replacement]

          path.write_text("".join(lines), encoding="utf-8")
          ast.parse(path.read_text(encoding="utf-8"))

          test_path = Path("tests/test_codex_security_review.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "test_gunicorn_config_module_namespace_update_payloads_are_dynamic"
          if marker not in tests:
              tests += '''


          @pytest.mark.parametrize(
              "config_content",
              [
                  "workers = 1\\nimport sys\\nsys.modules[__name__].__dict__.update(dict(workers=8))\\n",
                  "workers = 1\\nimport sys\\nsys.modules[__name__].__dict__.update([('workers', 8)])\\n",
                  "workers = 1\\nimport sys\\nignored = sys.modules[__name__].__dict__.update({'workers': 8})\\n",
                  "workers = 1\\nnamespace = globals()\\nnamespace.update({'workers': 8})\\n",
              ],
          )
          def test_gunicorn_config_module_namespace_update_payloads_are_dynamic(
              tmp_path, config_content
          ):
              config_file = tmp_path / "gunicorn.conf.py"
              config_file.write_text(config_content, encoding="utf-8")

              assert config._workers_from_gunicorn_config_path(str(config_file)) == (1, True)


          @pytest.mark.parametrize(
              "config_content",
              [
                  "workers = 1\\nsettings = {}\\nsettings.update({'workers': 4})\\n",
                  "workers = 1\\nsettings = {}\\nignored = settings.update({'workers': 4})\\n",
                  "workers = 1\\nnamespace = globals()\\nnamespace = {}\\nnamespace.update({'workers': 4})\\n",
              ],
          )
          def test_gunicorn_config_unrelated_mapping_updates_are_not_dynamic(
              tmp_path, config_content
          ):
              config_file = tmp_path / "gunicorn.conf.py"
              config_file.write_text(config_content, encoding="utf-8")

              assert config._workers_from_gunicorn_config_path(str(config_file)) == (1, False)
          '''
              test_path.write_text(tests, encoding="utf-8")
              ast.parse(tests)
          PY

      - name: Verify syntax
        run: python3 -m compileall -q config.py tests/test_codex_security_review.py

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet -- config.py tests/test_codex_security_review.py; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.py tests/test_codex_security_review.py
          git commit -m "fix: address worker mutation review findings"
          git push origin HEAD:cursor/application-security-review-5a20
