name: PR 167 Sonar complexity refactor

on:
  push:
    branches:
      - cursor/application-security-review-5a20
    paths:
      - .github/workflows/pr167-sonar-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cursor/application-security-review-5a20

      - name: Refactor namespace alias collection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("config.py")
          source = path.read_text(encoding="utf-8")

          old = '''def _collect_module_namespace_aliases(tree):
              """Collect names that are always assigned a module namespace mapping."""
              assignments = {}

              def record(statements):
                  for node in statements:
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                          continue
                      if isinstance(node, ast.Assign):
                          for target in node.targets:
                              if isinstance(target, ast.Name):
                                  assignments.setdefault(target.id, []).append(node.value)
                      elif isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                          assignments.setdefault(node.target.id, []).append(node.value)
                      elif isinstance(node, ast.AugAssign) and isinstance(node.target, ast.Name):
                          assignments.setdefault(node.target.id, []).append(None)
                      for block in _compound_statement_blocks(node):
                          record(block)

              record(tree.body)
              aliases = set()
              changed = True
              while changed:
                  changed = False
                  for name, values in assignments.items():
                      if name in aliases or not values:
                          continue
                      if all(
                          value is not None
                          and _is_module_namespace_mapping(value, aliases)
                          for value in values
                      ):
                          aliases.add(name)
                          changed = True
              return aliases
          '''

          new = '''def _namespace_assignment_values(node):
              """Return simple name assignments relevant to namespace alias tracking."""
              if isinstance(node, ast.Assign):
                  return [
                      (target.id, node.value)
                      for target in node.targets
                      if isinstance(target, ast.Name)
                  ]
              if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                  return [(node.target.id, node.value)]
              if isinstance(node, ast.AugAssign) and isinstance(node.target, ast.Name):
                  return [(node.target.id, None)]
              return []


          def _record_module_namespace_assignments(statements, assignments):
              """Collect module-level assignments, including compound statement bodies."""
              for node in statements:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      continue
                  for name, value in _namespace_assignment_values(node):
                      assignments.setdefault(name, []).append(value)
                  for block in _compound_statement_blocks(node):
                      _record_module_namespace_assignments(block, assignments)


          def _values_are_module_namespace_aliases(values, aliases):
              """Return True when every assignment resolves to the module namespace."""
              return bool(values) and all(
                  value is not None and _is_module_namespace_mapping(value, aliases)
                  for value in values
              )


          def _resolve_module_namespace_aliases(assignments):
              """Resolve aliases transitively until no additional names can be proven."""
              aliases = set()
              unresolved = set(assignments)
              while unresolved:
                  discovered = {
                      name
                      for name in unresolved
                      if _values_are_module_namespace_aliases(assignments[name], aliases)
                  }
                  if not discovered:
                      break
                  aliases.update(discovered)
                  unresolved.difference_update(discovered)
              return aliases


          def _collect_module_namespace_aliases(tree):
              """Collect names that are always assigned a module namespace mapping."""
              assignments = {}
              _record_module_namespace_assignments(tree.body, assignments)
              return _resolve_module_namespace_aliases(assignments)
          '''

          if old not in source:
              raise SystemExit("Expected _collect_module_namespace_aliases block not found")

          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify syntax
        run: python3 -m compileall -q config.py

      - name: Commit refactor and remove helper workflow
        shell: bash
        run: |
          git rm .github/workflows/pr167-sonar-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.py
          git commit -m "refactor: reduce namespace alias collector complexity"
          git push origin HEAD:cursor/application-security-review-5a20
