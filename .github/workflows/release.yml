name: Release

# Builds and packages tagged releases. Push a tag like `v0.1.0`, or run the
# workflow manually to create the requested tag from the selected branch commit.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create (e.g. v0.1.5 or v0.1.5.1)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify before release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # github.sha pins both tag-push and manual runs to the exact commit
          # selected when the workflow was started. The manual tag does not need
          # to exist yet; the release action creates it later.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install --only-binary :all: -r requirements.txt 'pytest==9.1.1'

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci-validation-only-32chars
          PASSWORD: test-password-for-ci-only
          LRTMP2_API_TOKEN: test-api-token-for-ci-only
        run: python -m pytest -q --tb=short -m "not integration"

      - name: Validate frontend JavaScript
        run: node --check static/js/scripts.js

  package:
    name: build & package
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.tag }}
      source_sha: ${{ steps.ver.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve and validate version
        id: ver
        env:
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Accept the project's extended numeric version scheme (at least
          # MAJOR.MINOR.PATCH, with optional additional numeric components),
          # plus optional pre-release and build metadata suffixes.
          if [[ ! "$REF" =~ ^v[0-9]+(\.[0-9]+){2,}(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Release tag must use a version format such as v0.1.5, v0.1.5.1, v0.1.5-rc1, or v0.1.5+build.1"
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$REF"; then
            echo "::error::Release tag is not a valid Git tag name"
            exit 1
          fi

          VERSION="${REF#v}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$REF" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate release tag target
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          SOURCE_SHA: ${{ steps.ver.outputs.source_sha }}
        run: |
          git fetch --force --tags
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_SHA" != "$SOURCE_SHA" ]; then
              echo "::error::Tag $TAG already exists at $TAG_SHA, not selected source commit $SOURCE_SHA"
              exit 1
            fi
          fi

      - name: Extract changelog section for this version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          CHANGELOG_VERSION="${VERSION%%+*}"
          awk -v ver="$CHANGELOG_VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ ("^## \\[" ver "\\]")) { found=1; next }
              next
            }
            /^\[.*\]:/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $CHANGELOG_VERSION (release tag version: $VERSION)"
            exit 1
          fi
          cat release-notes.md

      - name: Create source tarball
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="librtmp2-server-panel-${{ steps.ver.outputs.version }}/" \
            -o "dist/librtmp2-server-panel-${{ steps.ver.outputs.version }}-src.tar.gz" HEAD
          cd dist
          sha256sum "librtmp2-server-panel-${{ steps.ver.outputs.version }}-src.tar.gz" \
            > "librtmp2-server-panel-${{ steps.ver.outputs.version }}-src.tar.gz.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: librtmp2-server-panel-${{ steps.ver.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Publish GitHub Release and create tag when missing
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ steps.ver.outputs.source_sha }}
          name: librtmp2-server-panel ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.sha256

  docker:
    name: build & push docker image
    needs: package
    uses: ./.github/workflows/docker-multiarch.yml
    permissions:
      packages: write
      contents: read
    secrets: inherit
    with:
      version: ${{ needs.package.outputs.version }}
      ref: ${{ needs.package.outputs.source_sha }}
