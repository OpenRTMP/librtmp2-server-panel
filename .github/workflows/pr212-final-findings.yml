name: PR212 GitHub code quality fix

on:
  push:
    branches:
      - chatgpt/pr212-final-findings

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: cursor/application-security-review-81a9
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fix GitHub Code Quality finding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('config.py')
          text = path.read_text(encoding='utf-8')

          old = '''        self.importlib_module_aliases = (\n            {"importlib"}\n            if importlib_module_aliases is None\n            else set(importlib_module_aliases)\n        )\n\n\ndef _namespace_aliases_reference_current_module(node, namespace_aliases):\n'''
          new = '''        self.importlib_module_aliases = (\n            {"importlib"}\n            if importlib_module_aliases is None\n            else set(importlib_module_aliases)\n        )\n\n    def __eq__(self, other):\n        """Compare alias members and the module-reference metadata."""\n        if not isinstance(other, _ModuleNamespaceAliases):\n            return set.__eq__(self, other)\n        return (\n            set.__eq__(self, other)\n            and self.sys_aliases == other.sys_aliases\n            and self.importlib_aliases == other.importlib_aliases\n            and self.importlib_module_aliases == other.importlib_module_aliases\n        )\n\n\ndef _namespace_aliases_reference_current_module(node, namespace_aliases):\n'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one _ModuleNamespaceAliases insertion point, got {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Compile config
        run: python -m py_compile config.py

      - name: Install test dependencies
        run: pip install -r requirements.txt pytest

      - name: Run regression tests
        run: python -m pytest -q tests/test_gunicorn_indirect_workers_bypass.py

      - name: Commit and push PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.py
          git commit -m "fix: include namespace alias metadata in equality"
          git push origin HEAD:cursor/application-security-review-81a9
