name: PR 169 Sonar empty hook fix

on:
  push:
    branches:
      - cursor/ci-autofix-test-pr168-fix
    paths:
      - .github/workflows/pr169-sonar-empty-hook-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cursor/ci-autofix-test-pr168-fix
          fetch-depth: 0
      - name: Document intentional empty rate-limit hook
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def _stream_stats_rate_limit():\n        pass\n'''
          new = '''    def _stream_stats_rate_limit():\n        # Intentionally empty: Flask-Limiter enforces both limits via the decorators\n        # when this before_request hook is invoked; no additional handler logic is needed.\n        pass\n'''
          if old not in text:
              raise SystemExit("Expected _stream_stats_rate_limit body not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Verify syntax
        run: python -m py_compile app.py
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "Alexander Wagner"
          git config user.email "github@alexanderwagnerdev.com"
          git add app.py
          git rm .github/workflows/pr169-sonar-empty-hook-fix.yml
          git commit -m "fix: document intentional stats rate-limit hook"
          git push origin HEAD:cursor/ci-autofix-test-pr168-fix
