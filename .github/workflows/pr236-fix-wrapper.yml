name: Repair PR 236 Codex workflow

on:
  push:
    branches:
      - cursor/application-security-review-6f28

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Repair YAML heredoc indentation
        shell: bash
        run: |
          sed -i "/^@pytest.mark.parametrize(/,/^PYTEST$/ s/^/          /" .github/workflows/pr236-codex-fixes.yml
          python -c "import yaml; yaml.safe_load(open('.github/workflows/pr236-codex-fixes.yml', encoding='utf-8'))" || true
          rm .github/workflows/pr236-fix-wrapper.yml
          git config user.name 'openrtmp-maintenance[bot]'
          git config user.email 'openrtmp-maintenance[bot]@users.noreply.github.com'
          git add .github/workflows/pr236-codex-fixes.yml .github/workflows/pr236-fix-wrapper.yml
          git commit -m 'chore: repair Codex fix workflow indentation'
          git push
