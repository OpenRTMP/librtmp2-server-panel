name: PR212 apply remaining Sonar fixes

on:
  push:
    branches:
      - chatgpt/fix-pr212-work

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: "pip install --only-binary=:all: Flask==3.1.3 gunicorn==26.0.0 requests==2.34.2 Flask-WTF==1.3.0 'Flask-Limiter[redis]==4.1.1' pytest==9.1.1"

      - name: Apply remaining Sonar fixes
        run: python .tmp/pr212_fix_sonar2.py

      - name: Run unit tests
        env:
          SECRET_KEY: test-secret-key-for-ci-validation-only-32chars
          PASSWORD: test-password-for-ci-only
          LRTMP2_API_TOKEN: test-api-token-for-ci-only
        run: python -m pytest -q --tb=short -m "not integration"

      - name: Commit clean result
        run: |
          rm -f .tmp/pr212_fix_sonar2.py
          rm -f .tmp/pr212-sonar-annotations-2.json
          rm -f .github/workflows/pr212-sonar-diagnose-2.yml
          rm -f .github/workflows/pr212-apply-sonar2.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reduce PR212 scanner complexity"
          git push
